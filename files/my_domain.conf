server {
    listen 80 default_server;

    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8080;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_cache my_cache;
        proxy_cache_valid 200 302 10m;
        proxy_cache_valid 404 1m;
    }

    location /actuator/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location /swagger-ui/ {
        proxy_pass http://127.0.0.1:8080;
    }
}