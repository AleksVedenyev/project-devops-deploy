server {
    listen 80;

    server_name aleks-devops.ru www.aleks-devops.ru;

    location / {
        proxy_pass http://127.0.0.1:8080;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_cache my_cache;
        proxy_cache_valid 200 302 30s;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location /actuator/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location /swagger-ui/ {
        proxy_pass http://127.0.0.1:8080;
    }
}