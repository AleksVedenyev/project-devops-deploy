server {
    listen 80;

    server_name aleks-devops.ru www.aleks-devops.ru;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;

    server_name aleks-devops.ru www.aleks-devops.ru;

    ssl_certificate     /etc/letsencrypt/live/aleks-devops.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aleks-devops.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:8080;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location /actuator/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location /swagger-ui/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff|woff2|ttf)$ {
        proxy_pass http://127.0.0.1:8080;
        expires 3d;
        add_header Cache-Control "public, no-transform";
    }
}