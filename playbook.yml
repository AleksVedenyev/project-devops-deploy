- hosts: all
  become: true
  roles:
    - role: geerlingguy.docker
    - role: geerlingguy.nginx
      vars:
        nginx_proxy_cache_path: "/var/cache/nginx keys_zone=my_cache:10m max_size=1g"
    - role: geerlingguy.certbot
      vars:
        certbot_auto_renew: true
        certbot_auto_renew_user: "{{ ansible_user | default(lookup('env', 'USER')) }}"
        certbot_auto_renew_hour: "3"
        certbot_auto_renew_minute: "30"
        certbot_auto_renew_options: "--quiet"
        certbot_create_if_missing: True
        certbot_admin_email: aleks.vedenev@gmail.com
        certbot_certs:
          - name: aleks-devops.ru
            domains:
              - aleks-devops.ru
              - www.aleks-devops.ru
        certbot_create_standalone_stop_services:
          - nginx

  tasks:
    - name: Remove default Nginx vhost
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Copy nginx conf file to remote host
      ansible.builtin.copy:
        src: files/my_domain.conf   
        dest: /etc/nginx/conf.d/my_domain.conf
        owner: root
        group: root
        mode: '0644'
      notify: Nginx reload

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ user }}"
        create_home: true
        shell: /bin/bash
        groups: docker
        append: true

    - name: Deny everything and enable UFW
      community.general.ufw:
        policy: deny
        state: enabled

    - name: UFW allow SSH
      community.general.ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: UFW allow HTTP
      community.general.ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: UFW allow HTTPS
      community.general.ufw:
        rule: allow
        port: '443'
        proto: tcp
    
  handlers:
    - name: Nginx reload
      service:
        name: nginx
        state: reloaded
